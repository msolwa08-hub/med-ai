# Render Blueprint for MedAI Beta
# Deploy from your phone: render.com → New → Blueprint → pick this repo.
# Render reads this file, builds the Dockerfile, and asks you for the secrets
# marked "sync: false" below.
#
# Persistence is OPTIONAL and manual (not auto-provisioned): Render's free
# tier allows only ONE free Postgres database per account, so this Blueprint
# does not try to create one for you — that would collide with any free
# database you already have elsewhere and fail the whole deploy. To enable
# durable sessions/protocols, create (or reuse) a Postgres database yourself
# and paste its connection string into DATABASE_URL below. Leave it blank and
# the app runs exactly as before: memory-only, client-replay/localStorage
# fallback, nothing broken.
#
# Marketplace/dispatch: JWT secrets are auto-generated below. The last gate is
# ENCRYPTION_KEY (must be EXACTLY 64 hex chars — generate with
# `openssl rand -hex 32` and add it in the Render dashboard). Until DATABASE_URL
# AND ENCRYPTION_KEY are both set, the marketplace routes stay unmounted and
# the app runs exactly as before.

services:
  - type: web
    name: medai-beta
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: claude/ai-medical-history-app-1lh4wv # build the full app (patient + cockpit + tools)
    plan: free # no payment required; sleeps when idle (~30s cold start)
    region: frankfurt # closest free Render region to South Africa
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # paste your sk-ant-... key in the Render dashboard (secret)
      - key: BETA_ACCESS_KEYS
        sync: false # patient app keys, comma-separated (e.g. MEDAI-BETA-TRIAL)
      - key: BETA_DOCTOR_KEYS
        sync: false # doctor cockpit keys for /doctor (e.g. MEDAI-DOC-TRIAL)
      - key: BETA_TOOLS_KEYS
        sync: false # personal intern-tools keys for /tools (e.g. MEDAI-INTERN-TRIAL)
      - key: NODE_ENV
        value: production
      - key: BETA_DOCTOR_NAME
        sync: false # Your name, e.g. "Dr. Smith" — shown in AI greeting and summaries
      - key: BETA_PRACTICE_NAME
        sync: false # Your practice name, e.g. "Cape Town City Practice"
      - key: DATABASE_URL
        sync: false # OPTIONAL — paste a Postgres connection string to enable durable sessions/protocols; leave blank for memory-only mode
      - key: JWT_SECRET # marketplace auth — auto-generated
        generateValue: true
      - key: JWT_REFRESH_SECRET # marketplace auth — auto-generated
        generateValue: true
      # ENCRYPTION_KEY is intentionally NOT listed: add it manually in the
      # dashboard (64 hex chars) when you want to switch the marketplace on.
